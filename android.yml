# Builds an installable debug APK in the cloud. No Android Studio needed.
# Push this project to a GitHub repo, open the Actions tab, and download the APK from the finished run.
name: Android debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add the Android project (skipped if you already committed android/)
        run: test -d android || npx cap add android

      - name: Generate icons and splash screens
        run: npm run assets -- --android

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: picket-ship-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
